<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fauxdin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="searchbar">
          <img
            width="24px"
            height="24px"
            alt="search icon"
            src="./dash-materials/magnify.svg"
          />
          <label for="project-search"></label>
          <input type="search" id="projects-search" />
        </div>
        <div class="user-account">
          <img
            width="24px"
            height="24px"
            alt="notifications icon"
            src="./dash-materials/bell-ring.svg"
          />
          <img
            src="./dash-materials/account.svg"
            width="30px"
            height="30px"
            alt="Morgan's Profile picture."
          />
          <p>Morgan Oakley</p>
        </div>
        <div class="welcome">
          <img
            src="./dash-materials/account.svg"
            alt="Morgan's profile picture."
            width="100"
            height="100"
          />
          <div class="greeting">
            <p>Hi there,</p>
            <p class="user">Morgan Oakley (@morgan)</p>
          </div>
        </div>
        <div class="btns">
          <button>New</button><button>Upload</button><button>Share</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="branding">
          <img
            src="dash-materials/gate-xor.svg"
            width="24px"
            height="24px"
            alt="XOR-gate"
          />
          <p>Dashboard</p>
        </div>
        <ul class="sidebar-list1">
          <li>
            <img
              src="dash-materials/home.svg"
              width="18px"
              height="18px"
              alt=""
            />
            <p>Home</p>
          </li>
          <li>
            <img
              src="dash-materials/card-account-details-outline.svg"
              width="18px"
              height="18px"
              alt=""
            />
            <p>Profile</p>
          </li>
          <li>
            <img
              src="dash-materials/message.svg"
              width="18px"
              height="18px"
              alt=""
            />
            <p>Messages</p>
          </li>
          <li>
            <img
              src="dash-materials/clock-outline.svg"
              width="18px"
              height="18px"
              alt=""
            />
            <p>History</p>
          </li>
          <li>
            <img
              src="dash-materials/note-multiple-outline.svg"
              width="18px"
              height="18px"
              alt=""
            />
            <p>Tasks</p>
          </li>
          <li>
            <img
              src="dash-materials/account-group.svg"
              width="18px"
              height="18px"
              alt="people"
            />
            <p>Communities</p>
          </li>
        </ul>
        <ul class="sidebar-list2">
          <li>
            <img
              src="dash-materials/cog.svg"
              width="18px"
              height="18px"
              alt=""
            />
            <p>Settings</p>
          </li>
          <li>
            <img
              src="dash-materials/help-box.svg"
              width="18px"
              height="18px"
              alt="question box"
            />
            <p>Support</p>
          </li>
          <li>
            <img
              src="./dash-materials/shield-check.svg"
              width="18px"
              height="18px"
              alt="shield with checkmark "
            />
            <p>Privacy</p>
          </li>
        </ul>
